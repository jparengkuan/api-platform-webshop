# Production stack:  reverse proxy (TLS)  →  varnish :80  →  php :80  →  database
#
# Runs behind the hosting platform's reverse proxy (e.g. Coolify), which terminates TLS and
# forwards the domain to the "varnish" service on port 80. Nothing is exposed publicly by
# this file; for testing on the machine itself Varnish listens on 127.0.0.1:${HTTP_PORT}.
#
#   cp .env.prod.local.dist .env.prod.local   # then fill in real secrets
#   docker compose -f compose.prod.yaml --env-file .env.prod.local up -d --build
#
# Standalone on purpose: compose.yaml/compose.override.yaml belong to the Doctrine recipe.

services:
  varnish:
    build:
      context: docker/varnish
    image: ${IMAGE_NAME:-api-platform-webshop}-varnish:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      VARNISH_SIZE: ${VARNISH_SIZE:-256M}
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:80
    healthcheck:
      test: ['CMD-SHELL', 'varnishadm ping >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      php:
        condition: service_healthy

  php:
    build:
      context: .
      target: prod
      args:
        # 1 for a staging/test environment with demo data (together with RESET_DEMO_DATA=1).
        INSTALL_DEV_DEPENDENCIES: ${INSTALL_DEV_DEPENDENCIES:-0}
    image: ${IMAGE_NAME:-api-platform-webshop}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Plain HTTP: TLS is terminated by the reverse proxy in front of Varnish.
      SERVER_NAME: ':80'
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=17&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?Set JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://localhost(:[0-9]+)?$}
      # Where API Platform sends BAN requests to invalidate cached responses.
      VARNISH_URL: http://varnish
      # Staging/test only: replace all data with the demo fixtures on every start.
      RESET_DEMO_DATA: ${RESET_DEMO_DATA:-0}
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', '${POSTGRES_DB:-app}', '-U', '${POSTGRES_USER:-app}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  database_data:
  jwt_keys:
