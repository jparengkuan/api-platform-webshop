[project]
name = "invoice-service"
version = "1.0.0"
description = "Turns OrderPlaced events into invoice PDFs and publishes them as invoice.generated events."
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
