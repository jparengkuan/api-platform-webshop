name: CI

# Runs on every push to every branch (master, develop, feature branches) and on every pull request.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # "-o pipefail": a failing command in a pipe fails the step.
    shell: bash

jobs:
  code-style:
    name: Code style (PHP-CS-Fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php
        with:
          tools: cs2pr

      # Violations appear as annotations on the offending lines (Files changed tab and job summary).
      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --format=checkstyle | cs2pr

      - name: Show the fixes as a diff
        if: failure()
        run: |
          vendor/bin/php-cs-fixer fix --dry-run --diff || true
          {
            echo '### ❌ Code style violations'
            echo 'Fix them locally with `ddev composer cs:fix` and commit the result.'
          } >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    name: Static analysis (PHPStan level 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php

      # PHPStan's Symfony extension reads the compiled dev container.
      - name: Build the container
        run: bin/console cache:warmup --env=dev

      # Errors appear as annotations on the offending lines.
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

      - name: Show the errors as a table
        if: failure()
        run: |
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=table || true
          {
            echo '### ❌ PHPStan found errors'
            echo 'Reproduce locally with `ddev composer phpstan`.'
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      # Doctrine appends "_test" to the database name in the test environment.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=17&charset=utf8
      # Throwaway OAuth2 key pair generated below; these values protect nothing outside this job.
      OAUTH_PASSPHRASE: ci-only-passphrase
      OAUTH_ENCRYPTION_KEY: ci-only-encryption-key

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-php

      - name: Generate OAuth2 key pair
        run: bin/console app:oauth:generate-keys --no-interaction

      - name: Create the test database
        run: |
          bin/console doctrine:database:create --if-not-exists
          bin/console doctrine:migrations:migrate --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --log-junit var/phpunit/junit.xml

      # Failed tests appear as annotations on the failing assertion and in the job summary.
      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: var/phpunit/junit.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false

  invoice-service:
    name: Invoice service (Ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/invoice
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/invoice/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and check formatting
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Run the tests
        run: pytest

  images:
    name: Build images
    # Only after all checks passed, and only for pushes to develop and master (not for pull requests).
    needs: [code-style, static-analysis, tests, invoice-service]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Every image gets two tags: the branch (what the servers pull) and branch-commit (to pin or
      # roll back to one build). develop is the test environment, so its app image also contains
      # the dev dependencies for the demo data.
      - name: Determine names and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch="$GITHUB_REF_NAME"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit=$branch-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$branch" = develop ]; then echo 'dev=1' >> "$GITHUB_OUTPUT"; else echo 'dev=0' >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          build-args: INSTALL_DEV_DEPENDENCIES=${{ steps.meta.outputs.dev }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.commit }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app-${{ steps.meta.outputs.branch }}
          cache-to: type=gha,mode=max,scope=app-${{ steps.meta.outputs.branch }}

      - name: Build and push the varnish image
        uses: docker/build-push-action@v6
        with:
          context: docker/varnish
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-varnish:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.image }}-varnish:${{ steps.meta.outputs.commit }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=varnish
          cache-to: type=gha,mode=max,scope=varnish

      - name: Build and push the invoice image
        uses: docker/build-push-action@v6
        with:
          context: services/invoice
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-invoice:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.image }}-invoice:${{ steps.meta.outputs.commit }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=invoice
          cache-to: type=gha,mode=max,scope=invoice

      - name: Summary
        run: |
          {
            echo '### 📦 Images pushed'
            echo "Tags \`${{ steps.meta.outputs.branch }}\` and \`${{ steps.meta.outputs.commit }}\` of:"
            echo "- \`${{ steps.meta.outputs.image }}\`"
            echo "- \`${{ steps.meta.outputs.image }}-varnish\`"
            echo "- \`${{ steps.meta.outputs.image }}-invoice\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    name: Deploy to test
    # Only after the images of this commit are in the registry, and only for pushes to develop.
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Never cancel a deployment halfway because a newer commit arrived.
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Trigger the Coolify deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_TEST_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo '::notice title=Test deploy skipped::Set the COOLIFY_TEST_WEBHOOK and COOLIFY_TOKEN repository secrets to enable it (see README > Deployment > Staging).'
            exit 0
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
          echo '### 🚀 Test deployment triggered' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coolify is building the new version; follow it under Deployments in Coolify.' >> "$GITHUB_STEP_SUMMARY"
