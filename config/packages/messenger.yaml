framework:
    messenger:
        transports:
            # Integration events for other systems: published to RabbitMQ as JSON, never consumed here.
            events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    exchange:
                        name: webshop.events
                        type: topic
                    # Declared on the first publish, so events are kept until a consumer reads them.
                    queues:
                        order_placed:
                            binding_keys: [!php/const App\Ordering\Application\Event\OrderPlaced::ROUTING_KEY]

            # Events from the Python invoice service, consumed by the worker (messenger:consume invoices).
            invoices:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Invoicing\Infrastructure\Messenger\InvoiceEventSerializer
                # A failed email is retried after 1, 5 and 25 minutes, then dropped (and logged).
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 5
                options:
                    exchange:
                        name: webshop.events
                        type: topic
                    queues:
                        invoice_generated:
                            binding_keys: [!php/const App\Invoicing\Application\Event\InvoiceGenerated::ROUTING_KEY]

        routing:
            App\Ordering\Application\Event\OrderPlaced: events

when@test:
    framework:
        messenger:
            transports:
                # serialize=true: every test also proves the event survives the JSON round trip.
                events: 'in-memory://?serialize=true'
                invoices: 'in-memory://'
