# OAuth2 authorization server (/authorize, /token) and resource server (the "api" firewall).
# Users log in on the API's own login page through the Authorization Code grant with PKCE;
# other grants are off. Clients are registered with "league:oauth2-server:create-client".
league_oauth2_server:
    authorization_server:
        private_key: '%env(resolve:OAUTH_PRIVATE_KEY)%'
        private_key_passphrase: '%env(resolve:OAUTH_PASSPHRASE)%'
        encryption_key: '%env(resolve:OAUTH_ENCRYPTION_KEY)%'
        # Both grants are disabled by default and will be removed in 2.0. Enable them only if you need them.
        enable_password_grant: false
        enable_implicit_grant: false
        enable_client_credentials_grant: false
        enable_device_code_grant: false
        enable_auth_code_grant: true
        enable_refresh_token_grant: true
        access_token_ttl: PT1H
        refresh_token_ttl: P1M
        auth_code_ttl: PT10M
    resource_server:
        public_key: '%env(resolve:OAUTH_PUBLIC_KEY)%'
    scopes:
        available: ['api']
        default: ['api']
    persistence:
        # Clients, authorization codes and tokens are stored in PostgreSQL.
        doctrine: ~
    client:
        # Store client secrets hashed. Set to true only to keep supporting legacy plaintext secrets.
        allow_plaintext_secrets: false

when@test:
    services:
        # Use the lowest bcrypt cost to speed up client secret hashing in tests.
        league.oauth2_server.password_hasher:
            class: Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher
            arguments:
                $cost: 4 # Lowest possible value for bcrypt
