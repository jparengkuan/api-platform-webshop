api_platform:
    title: Webshop API
    version: 1.0.0
    # The API resources are the entities in the Domain layer of each bounded context.
    mapping:
        paths:
            - '%kernel.project_dir%/src/Catalog/Domain'
            - '%kernel.project_dir%/src/Customer/Domain'
            - '%kernel.project_dir%/src/Ordering/Domain'
    # JSON-LD (Hydra) is the default; plain JSON is accepted too, as most frontends send it.
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    # Swagger UI's "Authorize" button: paste "Bearer <access token>" from the OAuth2 flow.
    swagger:
        api_keys:
            access_token:
                name: Authorization
                type: header
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

# Varnish caches public responses; on every change made through Doctrine, API Platform bans the
# cached responses that contain the changed resources (tagged with their IRIs).
when@prod:
    api_platform:
        http_cache:
            invalidation:
                enabled: true
                urls: ['%env(VARNISH_URL)%']

# Tests record the invalidations instead of sending them to a Varnish server.
when@test:
    api_platform:
        http_cache:
            invalidation:
                enabled: true
                purger: App\Tests\Support\RecordingPurger
