security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_customer_provider:
            entity:
                class: App\Entity\Customer
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # The API only accepts OAuth2 access tokens: "Authorization: Bearer <access token>".
        api:
            pattern: ^/api
            stateless: true
            provider: app_customer_provider
            oauth2: true
        # The OAuth2 authorization flow: /authorize requires a logged-in user, who logs in on the
        # login page with email and password (session-based, only for this flow). /token is
        # handled by the OAuth2 server, which authenticates the client itself.
        main:
            lazy: true
            provider: app_customer_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout

    # Note: Only the *first* matching rule is applied.
    # Access per endpoint is set with `security:` on the API Platform operations.
    access_control:
        - { path: ^/authorize, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
