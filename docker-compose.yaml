# Deployment stack (test and production):  reverse proxy (TLS)  →  varnish :80  →  php :80  →  database
#                                                                 └──→  rabbitmq (events)  ⇄  invoice
#                                                  worker (mails invoices)  ◀──┘
#
# Runs behind the hosting platform's reverse proxy (e.g. Coolify), which terminates TLS and
# forwards the domain to the "varnish" service on port 80. Nothing is exposed publicly by
# this file; for testing on the machine itself Varnish listens on 127.0.0.1:${HTTP_PORT}.
#
# The app, varnish and invoice images are built by the CI and pulled from the GitHub Container
# Registry: IMAGE_TAG "develop" for the test environment, "master" for production (or
# "<branch>-<commit>" to pin one build). To build them on this machine instead, add compose.build.yaml.
#
#   cp .env.prod.local.dist .env.prod.local   # then fill in real secrets
#   docker compose -f docker-compose.yaml --env-file .env.prod.local up -d --wait
#
# Standalone on purpose: compose.yaml/compose.override.yaml belong to the Doctrine recipe, and
# `docker compose` without -f keeps using those; always pass -f docker-compose.yaml for this stack.

# Configuration shared by the app (php) and the Messenger worker, which run the same image.
x-app-environment: &app-environment
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=17&charset=utf8
  # Encrypts the OAuth2 signing key (in the jwt_keys volume) and the authorization codes.
  OAUTH_PASSPHRASE: ${OAUTH_PASSPHRASE:?Set OAUTH_PASSPHRASE}
  OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?Set OAUTH_ENCRYPTION_KEY}
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://localhost(:[0-9]+)?$}
  # Where API Platform sends BAN requests to invalidate cached responses.
  VARNISH_URL: http://varnish
  # RabbitMQ: the app publishes OrderPlaced, the worker consumes invoice.generated.
  MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/%2f
  # Sends the invoice emails, e.g. smtp://user:pass@smtp.example.com:587 (null://null sends nothing).
  MAILER_DSN: ${MAILER_DSN:?Set MAILER_DSN}
  MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
  # Stripe: the secret key (sk_live_/sk_test_) and the signing secret of the webhook endpoint.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
  # The frontend Stripe sends the customer back to after paying.
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}

services:
  varnish:
    image: ${IMAGE_NAME:-ghcr.io/jparengkuan/api-platform-webshop}-varnish:${IMAGE_TAG:?Set IMAGE_TAG}
    # The tag moves with every build of the branch: fetch the newest one on every deployment.
    pull_policy: always
    restart: unless-stopped
    environment:
      VARNISH_SIZE: ${VARNISH_SIZE:-256M}
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:80
    healthcheck:
      test: ['CMD-SHELL', 'varnishadm ping >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      php:
        condition: service_healthy

  php:
    # The "develop" image contains the dev dependencies for the demo data; "master" doesn't.
    image: ${IMAGE_NAME:-ghcr.io/jparengkuan/api-platform-webshop}:${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *app-environment
      # Plain HTTP: TLS is terminated by the reverse proxy in front of Varnish.
      SERVER_NAME: ':80'
      # Staging/test only: replace all data with the demo fixtures on every start.
      RESET_DEMO_DATA: ${RESET_DEMO_DATA:-0}
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Messenger worker: the same image, mailing each invoice PDF to the customer (invoice.generated)
  # and running the scheduled tasks, such as expiring unpaid orders. It stops after an hour (or
  # 128 MB) and Docker starts a fresh one.
  worker:
    image: ${IMAGE_NAME:-ghcr.io/jparengkuan/api-platform-webshop}:${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    command: ['bin/console', 'messenger:consume', 'outbox', 'invoices', 'scheduler_default', '--time-limit=3600', '--memory-limit=128M', '-vv']
    environment: *app-environment
    # The image's health check probes the web server, which doesn't run here.
    healthcheck:
      disable: true
    depends_on:
      # php has run the migrations by the time it's healthy.
      php:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-alpine
    # RabbitMQ stores its data per node name, which is derived from the hostname: keep it fixed.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Python service: turns every OrderPlaced event into an invoice PDF, published as invoice.generated.
  invoice:
    image: ${IMAGE_NAME:-ghcr.io/jparengkuan/api-platform-webshop}-invoice:${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/%2f
    depends_on:
      rabbitmq:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', '${POSTGRES_DB:-app}', '-U', '${POSTGRES_USER:-app}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  database_data:
  jwt_keys:
  rabbitmq_data:
